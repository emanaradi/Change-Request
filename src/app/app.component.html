<header class="app-header">
	<h1>Change Request Review</h1>
	<label>
		Acting as:
		<select (change)="switchUser($any($event.target).value)">
			<option *ngFor="let key of userKeys" [value]="key" [selected]="session.user.id === users[key]?.id">{{ key }}</option>
		</select>
	</label>
</header>

<main class="app-layout" *ngIf="show">
	<app-cr-list (select)="onSelect($event)"></app-cr-list>
	<app-cr-detail *ngIf="selectedId; else noSelection" [id]="selectedId" (changed)="onChangeRequestChanged()"></app-cr-detail>

	<ng-template #noSelection>
		<section class="cr-detail cr-detail--empty">
			<p>Select a change request to view its details.</p>
		</section>
	</ng-template>
</main>
